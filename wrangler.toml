name = "apex-prime"
main = "worker/index.js"
compatibility_date = "2026-09-22"
compatibility_flags = ["nodejs_compat"]

[vars]
PUBLIC_API_DATABASE = "production"

[assets]
directory = "./dist"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "apex-prime-db"
database_id = "REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID"
migrations_dir = "d1-migrations"

[[d1_databases]]
binding = "STAGING_DB"
database_name = "apex-prime-staging"
database_id = "8940eeeb-9cd9-40b6-9478-ff0ae4d91e3a"
migrations_dir = "d1-migrations"

[env.staging]
name = "apex-prime-staging-worker"

[env.staging.vars]
PUBLIC_API_DATABASE = "staging"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "apex-prime-staging"
database_id = "8940eeeb-9cd9-40b6-9478-ff0ae4d91e3a"
migrations_dir = "d1-migrations"

[[env.staging.d1_databases]]
binding = "STAGING_DB"
database_name = "apex-prime-staging"
database_id = "8940eeeb-9cd9-40b6-9478-ff0ae4d91e3a"
migrations_dir = "d1-migrations"