<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wallet Connect Test</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #0d1117;
        color: #e6edf3;
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
      }
      .card {
        width: min(420px, 92vw);
        background: #161b22;
        border: 1px solid #30363d;
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
      }
      h1 {
        margin-top: 0;
        font-size: 1.5rem;
      }
      button {
        background: #238636;
        color: white;
        border: none;
        border-radius: 10px;
        padding: 12px 18px;
        font-weight: 700;
        cursor: pointer;
        margin-right: 10px;
      }
      button.secondary {
        background: #21262d;
      }
      #status {
        margin-top: 20px;
        padding: 12px;
        background: rgba(255,255,255,0.03);
        border-radius: 8px;
        border: 1px solid #30363d;
        line-height: 1.5;
      }
      .label {
        color: #8b949e;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        margin-bottom: 8px;
      }
      #walletAddress {
        margin-top: 12px;
        word-break: break-all;
        color: #c9d1d9;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Wallet Connect</h1>

      <div>
        <button id="connectBtn" type="button">Connect Wallet</button>
        <button id="signBtn" class="secondary" type="button">Sign Message</button>
      </div>

      <div class="label" style="margin-top: 20px;">Wallet</div>
      <div id="walletAddress">Not connected</div>

      <div id="status">Wallet not connected</div>
    </div>

    <script src="./wallet-connect.js"></script>
  </body>
</html>
